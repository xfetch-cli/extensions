[package]
name = "xfetch-extension-wasm-night-mode"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Xfetch config provider that dims the fetch at night, compiled to WebAssembly"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xfetch-extension-api = { workspace = true }
